<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Channel Leaderboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #000000;
            min-height: 100vh;
            padding: 20px;
            color: #ffffff;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background grid */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Gradient orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            z-index: 1;
            animation: float 20s ease-in-out infinite;
        }

        .orb1 {
            width: 500px;
            height: 500px;
            background: #ffffff;
            top: -250px;
            left: -250px;
        }

        .orb2 {
            width: 400px;
            height: 400px;
            background: #ffffff;
            bottom: -200px;
            right: -200px;
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, 30px) scale(1.1); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 0.8s ease;
        }

        h1 {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 15px;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #ffffff 0%, #888888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #888888;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 50px;
            animation: fadeIn 1s ease;
        }

        .tab-btn {
            background: transparent;
            border: 2px solid #333333;
            color: #ffffff;
            padding: 15px 40px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .tab-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: #ffffff;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translate(-50%, -50%);
        }

        .tab-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .tab-btn:hover {
            border-color: #ffffff;
            color: #000000;
        }

        .tab-btn.active {
            background: #ffffff;
            border-color: #ffffff;
            color: #000000;
        }

        .tab-btn span {
            position: relative;
            z-index: 1;
        }

        .content-section {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .content-section.active {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .stat-card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 35px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            animation: fadeInUp 0.8s ease;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.1), transparent);
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255,255,255,0.3);
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-value {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ffffff 0%, #888888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 0.95rem;
            color: #666666;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .leaderboard {
            background: rgba(255,255,255,0.02);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            animation: fadeInUp 1s ease;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            gap: 25px;
            background: rgba(255,255,255,0.03);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 15px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideInLeft 0.5s ease;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }

        .leaderboard-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 3px;
            background: linear-gradient(180deg, #ffffff, #888888);
            transform: scaleY(0);
            transition: transform 0.4s ease;
        }

        .leaderboard-item:hover {
            background: rgba(255,255,255,0.06);
            transform: translateX(10px);
            border-color: rgba(255,255,255,0.15);
        }

        .leaderboard-item:hover::before {
            transform: scaleY(1);
        }

        .rank {
            font-size: 2rem;
            font-weight: 900;
            min-width: 70px;
            text-align: center;
            letter-spacing: -1px;
        }

        .rank.gold { 
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .rank.silver { 
            background: linear-gradient(135deg, #E8E8E8, #A0A0A0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .rank.bronze { 
            background: linear-gradient(135deg, #CD7F32, #8B4513);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.2);
            object-fit: cover;
            transition: all 0.4s ease;
        }

        .leaderboard-item:hover .avatar {
            border-color: #ffffff;
            transform: scale(1.1);
        }

        .user-info {
            flex: 1;
        }

        .username {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .time {
            font-size: 1.8rem;
            font-weight: 900;
            text-align: right;
            min-width: 130px;
            color: #ffffff;
            letter-spacing: -1px;
        }

        .status {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-left: 12px;
            box-shadow: 0 0 10px currentColor;
        }

        .status.online { 
            background: #00ff00;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .status.offline { 
            background: #444444;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading {
            text-align: center;
            padding: 80px;
            font-size: 1.3rem;
            color: #666666;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .error {
            background: rgba(255,0,0,0.1);
            border: 2px solid rgba(255,0,0,0.3);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin: 20px 0;
        }

        .refresh-btn {
            position: fixed;
            bottom: 40px;
            right: 40px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.2);
            color: white;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 2rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .refresh-btn:hover {
            background: #ffffff;
            border-color: #ffffff;
            color: #000000;
            transform: rotate(180deg) scale(1.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #111111;
        }

        ::-webkit-scrollbar-thumb {
            background: #333333;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555555;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .tabs { flex-direction: column; }
            .leaderboard-item {
                flex-direction: column;
                text-align: center;
            }
            .time {
                text-align: center;
            }
            .leaderboard {
                padding: 20px;
            }
            .orb { display: none; }
        }
    </style>
</head>
<body>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <div class="container">
        <header>
            <h1>🎙️ VOICE STATS</h1>
            <p class="subtitle">MADE BY KIDD</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('leaderboard')">
                <span> LEADERBOARD</span>
            </button>
            <button class="tab-btn" onclick="switchTab('current')">
                <span> LIVE NOW</span>
            </button>
        </div>

        <div id="leaderboard" class="content-section active">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="total-users">-</div>
                    <div class="stat-label">Total Users</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="total-time">-</div>
                    <div class="stat-label">Total Hours</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="current-count">-</div>
                    <div class="stat-label">Currently Live</div>
                </div>
            </div>

            <div class="leaderboard">
                <div id="leaderboard-content" class="loading">
                    Loading leaderboard
                </div>
            </div>
        </div>

        <div id="current" class="content-section">
            <div class="leaderboard">
                <div id="current-content" class="loading">
                    Loading live users
                </div>
            </div>
        </div>
    </div>

    <button class="refresh-btn" onclick="loadData()" title="Refresh">
        ↻
    </button>

    <script>
        // IMPORTANT: Replace this with your actual Render.com bot URL
        const API_URL = 'https://bot-9q8b.onrender.com';
        
        let currentTab = 'leaderboard';

        function switchTab(tab) {
            currentTab = tab;
            
            // Update tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.closest('.tab-btn').classList.add('active');
            
            // Update content sections
            document.querySelectorAll('.content-section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(tab).classList.add('active');
            
            loadData();
        }

        function formatTime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            return `${hours}h ${minutes}m`;
        }

        function getRankDisplay(index) {
            const medals = ['🥇', '🥈', '🥉'];
            if (index < 3) {
                return `<span class="rank ${['gold', 'silver', 'bronze'][index]}">${medals[index]}</span>`;
            }
            return `<span class="rank">#${index + 1}</span>`;
        }

        async function loadLeaderboard() {
            try {
                const response = await fetch(`${API_URL}/api/leaderboard`);
                
                if (!response.ok) {
                    throw new Error('Failed to load leaderboard');
                }
                
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error('API returned error');
                }
                
                // Update stats
                document.getElementById('total-users').textContent = data.total_users;
                
                const totalHours = Math.floor(
                    data.leaderboard.reduce((sum, user) => sum + user.total_seconds, 0) / 3600
                );
                document.getElementById('total-time').textContent = totalHours;
                
                const currentlyInVC = data.leaderboard.filter(user => user.in_vc).length;
                document.getElementById('current-count').textContent = currentlyInVC;
                
                // Build leaderboard HTML
                const content = document.getElementById('leaderboard-content');
                
                if (data.leaderboard.length === 0) {
                    content.innerHTML = '<p style="text-align: center; padding: 50px; color: #666;">No data available yet. Start using voice channels!</p>';
                    return;
                }
                
                content.innerHTML = data.leaderboard.map((user, index) => `
                    <div class="leaderboard-item" style="animation-delay: ${index * 0.05}s">
                        ${getRankDisplay(index)}
                        <img src="${user.avatar || 'https://cdn.discordapp.com/embed/avatars/0.png'}" 
                             alt="${user.username}" 
                             class="avatar"
                             onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
                        <div class="user-info">
                            <div class="username">
                                ${user.username}
                                <span class="status ${user.in_vc ? 'online' : 'offline'}"></span>
                            </div>
                        </div>
                        <div class="time">${formatTime(user.total_seconds)}</div>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('Error loading leaderboard:', error);
                document.getElementById('leaderboard-content').innerHTML = `
                    <div class="error">
                        <p><strong>⚠️ Error Loading Data</strong></p>
                        <p>Make sure to update the API_URL in the code with your Render.com bot URL.</p>
                        <p style="font-size: 0.9rem; margin-top: 10px; color: #ff6666;">Error: ${error.message}</p>
                    </div>
                `;
            }
        }

        async function loadCurrent() {
            try {
                const response = await fetch(`${API_URL}/api/current`);
                
                if (!response.ok) {
                    throw new Error('Failed to load current users');
                }
                
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error('API returned error');
                }
                
                const content = document.getElementById('current-content');
                
                if (data.current_users.length === 0) {
                    content.innerHTML = '<p style="text-align: center; padding: 50px; color: #666;">No one is currently in voice channels.</p>';
                    return;
                }
                
                content.innerHTML = data.current_users.map((user, index) => `
                    <div class="leaderboard-item" style="animation-delay: ${index * 0.05}s">
                        <img src="${user.avatar || 'https://cdn.discordapp.com/embed/avatars/0.png'}" 
                             alt="${user.username}" 
                             class="avatar"
                             onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
                        <div class="user-info">
                            <div class="username">
                                ${user.username}
                                <span class="status online"></span>
                            </div>
                            <div style="opacity: 0.6; font-size: 0.95rem; margin-top: 5px;">Current session: ${formatTime(user.session_duration)}</div>
                        </div>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('Error loading current users:', error);
                document.getElementById('current-content').innerHTML = `
                    <div class="error">
                        <p><strong>⚠️ Error Loading Data</strong></p>
                        <p>Make sure to update the API_URL in the code with your Render.com bot URL.</p>
                        <p style="font-size: 0.9rem; margin-top: 10px; color: #ff6666;">Error: ${error.message}</p>
                    </div>
                `;
            }
        }

        function loadData() {
            if (currentTab === 'leaderboard') {
                loadLeaderboard();
            } else {
                loadCurrent();
            }
        }

        // Load data on page load
        loadData();

        // Auto-refresh every 30 seconds
        setInterval(loadData, 30000);
    </script>
</body>
</html>
